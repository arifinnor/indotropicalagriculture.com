<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Subtle pattern - leaf shapes -->
  <g opacity="0.1">
    <ellipse cx="100" cy="100" rx="60" ry="30" transform="rotate(45 100 100)" fill="white"/>
    <ellipse cx="1100" cy="530" rx="80" ry="40" transform="rotate(-30 1100 530)" fill="white"/>
    <ellipse cx="1050" cy="150" rx="50" ry="25" transform="rotate(60 1050 150)" fill="white"/>
    <ellipse cx="150" cy="480" rx="70" ry="35" transform="rotate(-45 150 480)" fill="white"/>
  </g>

  <!-- Main content container -->
  <g transform="translate(100, 180)">
    <!-- Title text -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white">
      Indo Tropical Agriculture
    </text>

    <!-- Tagline -->
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="32" fill="#d1fae5">
      Indonesian Agriculture Exporter
    </text>

    <!-- Divider line -->
    <line x1="0" y1="145" x2="180" y2="145" stroke="#34d399" stroke-width="4"/>

    <!-- Subtitle -->
    <text x="0" y="190" font-family="Arial, sans-serif" font-size="24" fill="#ecfdf5">
      Premium Cloves • Ginger • Nutmeg • Vanilla
    </text>
    <text x="0" y="225" font-family="Arial, sans-serif" font-size="24" fill="#ecfdf5">
      Black Pepper • Turmeric • Cashew Nuts
    </text>
  </g>

  <!-- URL at bottom -->
  <text x="100" y="570" font-family="Arial, sans-serif" font-size="20" fill="#d1fae5">
    indotropicalagriculture.com
  </text>
</svg>
